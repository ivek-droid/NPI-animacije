<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analogna in digitalna ura</title>
<style>
/* Postavitev: nastavitve na vrhu, pod njimi dve enako veliki plošči (analogna | digitalna), na telefonu v enem stolpcu. */
/* Brez zunanjih pisav: uporabljene so sistemske pisave (brez klicev na zunanje strežnike). */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#14233A; --muted:#55657B; --line:#C9D3E0;
  --primary:#1D4ED8; --primary-ink:#FFFFFF; --primary-soft:#E4ECFD;
  --minute:#D9480F; --hour:#14233A; --face:#F8FAFD; --help24:#1D4ED8;
  --ok:#17734A; --ok-bg:#E1F3E8; --bad:#B42318; --bad-bg:#FCE8E6;
  --hint-bg:#FFF1CF; --hint-ink:#5A3C00;
  --f-body:Verdana,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1520; --surface:#162233; --ink:#E7EEF7; --muted:#9AAABF; --line:#2C3B50;
    --primary:#6F9BFF; --primary-ink:#0A1220; --primary-soft:#1E2F4D;
    --minute:#FF8A54; --hour:#E7EEF7; --face:#101B2A; --help24:#8FB0FF;
    --ok:#6DD6A0; --ok-bg:#12301F; --bad:#FF8B7E; --bad-bg:#3A1714;
    --hint-bg:#3A2D0E; --hint-ink:#FFD98A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#162233; --ink:#E7EEF7; --muted:#9AAABF; --line:#2C3B50;
  --primary:#6F9BFF; --primary-ink:#0A1220; --primary-soft:#1E2F4D;
  --minute:#FF8A54; --hour:#E7EEF7; --face:#101B2A; --help24:#8FB0FF;
  --ok:#6DD6A0; --ok-bg:#12301F; --bad:#FF8B7E; --bad-bg:#3A1714;
  --hint-bg:#3A2D0E; --hint-ink:#FFD98A; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.15;margin:0 0 4px;text-wrap:balance}
h2{font-size:1.1rem;margin:0}
.lead{margin:0;color:var(--muted);max-width:60ch}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.controls{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
select{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:42px}
.chk{display:flex;gap:8px;align-items:center;min-height:42px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--primary)}

.task{margin:0;font-size:1.1rem;background:var(--primary-soft);border-radius:10px;padding:12px 16px;max-width:none}
.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.mine{border-color:var(--primary)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.mine .badge{background:var(--primary);color:var(--primary-ink)}

svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.rim{fill:var(--ink)}
.face{fill:var(--face)}
.tick{stroke:var(--ink);stroke-linecap:round}
.num{fill:var(--ink);font-family:var(--f-body);font-weight:700;font-size:24px;text-anchor:middle;dominant-baseline:central}
.mnum{fill:var(--minute);font-family:var(--f-body);font-weight:700;font-size:12px;text-anchor:middle;dominant-baseline:central}
.hnum{fill:var(--help24);font-family:var(--f-body);font-weight:700;font-size:14px;text-anchor:middle;dominant-baseline:central}
.hand-h{stroke:var(--hour);stroke-width:9;stroke-linecap:round}
.hand-m{stroke:var(--minute);stroke-width:5;stroke-linecap:round}
.cap{fill:var(--ink)}
.handle{fill:var(--primary);fill-opacity:.16;stroke:var(--primary);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
.handle.m{fill:var(--minute);stroke:var(--minute)}
.locked .handle{display:none}
.nohelp .help{display:none}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted);justify-content:center}
.sw{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.nudge{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.nudge button,.act button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;font-weight:700}
.nudge button:disabled{opacity:.4;cursor:not-allowed}

.digital{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 0}
.dcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.dcol input{width:clamp(88px,26vw,130px);font-family:var(--f-mono);font-size:clamp(2.8rem,12vw,4.4rem);text-align:center;border:3px solid var(--ink);border-radius:12px;background:var(--face);padding:4px 0;line-height:1.2;letter-spacing:.02em}
.dcol input::placeholder{color:var(--line)}
.dcol input:read-only{border-color:var(--line)}
.mine .dcol input{border-color:var(--primary)}
.step{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 0;cursor:pointer;font-size:1.1rem;line-height:1.3}
.step:disabled{opacity:.35;cursor:not-allowed}
.colon{font-family:var(--f-mono);font-size:clamp(2.8rem,12vw,4.4rem);padding-bottom:4px}
.cap2{font-size:.82rem;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:.92rem;text-align:center}

.act{display:flex;flex-wrap:wrap;gap:10px}
.act button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.act button:disabled{opacity:.45;cursor:not-allowed}
.fb{min-height:3.4em}
.fb>div{border-radius:10px;padding:12px 16px}
.fb .ok{background:var(--ok-bg);color:var(--ok)}
.fb .bad{background:var(--bad-bg);color:var(--bad)}
.fb .hint{background:var(--hint-bg);color:var(--hint-ink)}
.fb .info{background:var(--primary-soft)}
.fb strong{font-weight:700}
.fb .say{display:block;margin-top:4px;color:var(--ink);font-size:1.05rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<main class="wrap">
  <header>
    <h1>Analogna in digitalna ura</h1>
    <p class="lead">Ena ura je nastavljena. Drugo nastavi sam, tako da kaže isti čas, nato pritisni Preveri.</p>
  </header>

  <section class="controls" aria-label="Nastavitve vaje">
    <div class="ctl">
      <span class="lbl" id="lblMode">Naloga</span>
      <div class="seg" role="group" aria-labelledby="lblMode">
        <button type="button" data-mode="a2d" aria-pressed="true">Analogna → digitalna</button>
        <button type="button" data-mode="d2a" aria-pressed="false">Digitalna → analogna</button>
        <button type="button" data-mode="mix" aria-pressed="false">Mešano</button>
      </div>
    </div>
    <div class="ctl">
      <label class="lbl" for="level">Težavnost</label>
      <select id="level">
        <option value="1">1 – cele ure</option>
        <option value="2" selected>2 – cela, pol, četrt</option>
        <option value="3">3 – na 5 minut</option>
        <option value="4">4 – poljubne minute</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="help" checked> Pomoč na številčnici</label>
  </section>

  <p class="task" id="task"></p>

  <section class="stage">
    <article class="panel" id="pAna">
      <div class="ph"><h2>Analogna ura</h2><span class="badge" id="bAna"></span></div>
      <svg id="clock" viewBox="0 0 320 320" role="img" aria-label="Analogna ura"></svg>
      <div class="legend">
        <span><i class="sw" style="background:var(--hour)"></i>kratki kazalec = ure</span>
        <span><i class="sw" style="background:var(--minute)"></i>dolgi kazalec = minute</span>
      </div>
      <div class="nudge" id="nudge">
        <button type="button" data-n="h-">− ura</button>
        <button type="button" data-n="h+">+ ura</button>
        <button type="button" data-n="m-" id="nm1">− minute</button>
        <button type="button" data-n="m+" id="nm2">+ minute</button>
      </div>
    </article>

    <article class="panel" id="pDig">
      <div class="ph"><h2>Digitalna ura</h2><span class="badge" id="bDig"></span></div>
      <div class="digital">
        <div class="dcol">
          <button type="button" class="step" data-t="h" data-d="1" aria-label="Ure več">▲</button>
          <input id="dh" inputmode="numeric" maxlength="2" placeholder="––" autocomplete="off" aria-label="Ure, od 0 do 23">
          <button type="button" class="step" data-t="h" data-d="-1" aria-label="Ure manj">▼</button>
          <span class="cap2">ure (0–23)</span>
        </div>
        <div class="colon" aria-hidden="true">:</div>
        <div class="dcol">
          <button type="button" class="step" data-t="m" data-d="1" aria-label="Minute več">▲</button>
          <input id="dm" inputmode="numeric" maxlength="2" placeholder="––" autocomplete="off" aria-label="Minute, od 0 do 59">
          <button type="button" class="step" data-t="m" data-d="-1" aria-label="Minute manj">▼</button>
          <span class="cap2">minute (0–59)</span>
        </div>
      </div>
      <p class="note">24-urni zapis. Številke lahko vtipkaš ali uporabiš puščici.</p>
    </article>
  </section>

  <section class="act" aria-label="Dejanja">
    <button type="button" class="primary" id="bCheck">Preveri</button>
    <button type="button" id="bHint">Namig</button>
    <button type="button" id="bReveal">Pokaži rešitev</button>
    <button type="button" id="bNext">Nova naloga</button>
  </section>
  <div class="fb" id="fb" role="status" aria-live="polite"></div>

</main>

<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var NS='http://www.w3.org/2000/svg';
  var st={pref:'a2d',level:2,type:'a2d',target:{h:15,m:30},ana:{h12:0,m:0},solved:false,revealed:false,attempts:0,score:{solved:0,first:0}};
  var svg=$('#clock'),dh=$('#dh'),dm=$('#dm'),fb=$('#fb');

  /* ---------- številčnica ---------- */
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
  function pt(r,deg){var a=deg*Math.PI/180;return [160+r*Math.sin(a),160-r*Math.cos(a)];}
  el('circle',{cx:160,cy:160,r:152,'class':'rim'});
  el('circle',{cx:160,cy:160,r:146,'class':'face'});
  for(var i=0;i<60;i++){
    var big=i%5===0,p1=pt(144,i*6),p2=pt(big?131:137,i*6);
    el('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],'class':'tick','stroke-width':big?3:1.5});
  }
  var gHelp=el('g',{'class':'help'});
  for(var j=1;j<=12;j++){
    var pm=pt(119,j*30),ph=pt(70,j*30);
    var tm=el('text',{x:pm[0],y:pm[1],'class':'mnum'},gHelp);tm.textContent=String(j*5);
    var th=el('text',{x:ph[0],y:ph[1],'class':'hnum'},gHelp);th.textContent=String(j+12);
  }
  for(var k=1;k<=12;k++){
    var pn=pt(96,k*30);
    var tn=el('text',{x:pn[0],y:pn[1],'class':'num'});tn.textContent=String(k);
  }
  var gH=el('g',{}),gM=el('g',{});
  el('line',{x1:160,y1:160,x2:160,y2:106,'class':'hand-h'},gH);
  var hH=el('circle',{cx:160,cy:106,r:20,'class':'handle'},gH);
  el('line',{x1:160,y1:160,x2:160,y2:46,'class':'hand-m'},gM);
  var hM=el('circle',{cx:160,cy:46,r:18,'class':'handle m'},gM);
  el('circle',{cx:160,cy:160,r:8,'class':'cap'});

  function drawAna(){
    var a=st.ana;
    gH.setAttribute('transform','rotate('+(((a.h12*60+a.m)/720)*360)+' 160 160)');
    gM.setAttribute('transform','rotate('+(a.m*6)+' 160 160)');
  }

  /* ---------- pomožne funkcije ---------- */
  function pad(n){return (n<10?'0':'')+n;}
  function rnd(n){return Math.floor(Math.random()*n);}
  function minStep(){return st.level===4?1:5;}
  function lockedAna(){return st.type==='a2d'||st.solved||st.revealed;}
  function lockedDig(){return st.type==='d2a'||st.solved||st.revealed;}
  function randomTime(){
    var m;
    if(st.level===1)m=0;
    else if(st.level===2)m=[0,15,30,45][rnd(4)];
    else if(st.level===3)m=rnd(12)*5;
    else m=rnd(60);
    return {h:rnd(24),m:m};
  }
  function part(h,m){
    if(h===0&&m===0)return 'polnoč';
    if(h===12&&m===0)return 'poldne';
    if(h<5)return 'ponoči';
    if(h<9)return 'zjutraj';
    if(h<12)return 'dopoldne';
    if(h<18)return 'popoldne';
    if(h<22)return 'zvečer';
    return 'ponoči';
  }
  var NOM=['dvanajst','ena','dve','tri','štiri','pet','šest','sedem','osem','devet','deset','enajst'];
  var ACC=['dvanajst','eno','dve','tri','štiri','pet','šest','sedem','osem','devet','deset','enajst'];
  var GEN=['dvanajstih','ene','dveh','treh','štirih','petih','šestih','sedmih','osmih','devetih','desetih','enajstih'];
  function minWord(n){
    // slovenščina: ednina/dvojina/množina se ravna po zadnjih dveh mestih (1, 2, 3–4), npr. 21 minut, 101 minuta
    var b=n%100;
    if(b===1)return 'minuta';
    if(b===2)return 'minuti';
    if(b===3||b===4)return 'minute';
    return 'minut';
  }
  function say(h,m){
    var h12=h%12,nx=(h12+1)%12,p=part(h,m),s;
    if(m===0){
      if(h===0||h===12)return 'Ura je '+p+'.';
      s=NOM[h12];
    }else if(m===15)s='četrt čez '+ACC[h12];
    else if(m===30)s='pol '+GEN[nx];
    else if(m===45)s='četrt do '+GEN[nx];
    else if(m<30)s=m+' '+minWord(m)+' čez '+ACC[h12];
    else s=(60-m)+' '+minWord(60-m)+' do '+GEN[nx];
    return 'Ura je '+s+' '+p+'.';
  }
  function hh(t){return pad(t.h)+':'+pad(t.m);}

  /* ---------- povratne informacije ---------- */
  function setFb(kind,html){fb.innerHTML=html?'<div class="'+kind+'">'+html+'</div>':'';}

  /* ---------- izris stanja ---------- */
  function render(){
    var t=st.target,p=part(t.h,t.m);
    $('#task').innerHTML=st.type==='a2d'
      ?'<strong>Preberi analogno uro</strong> in vpiši čas na digitalno uro. Čas dneva: <strong>'+p+'</strong>.'
      :'<strong>Nastavi kazalca</strong> na analogni uri, da kažeta čas z digitalne ure. Čas dneva: <strong>'+p+'</strong>.';
    $('#pAna').classList.toggle('mine',st.type==='d2a');
    $('#pDig').classList.toggle('mine',st.type==='a2d');
    $('#bAna').textContent=st.type==='a2d'?'Dano':'Nastavi ti';
    $('#bDig').textContent=st.type==='d2a'?'Dano':'Nastavi ti';
    var la=lockedAna(),ld=lockedDig();
    svg.classList.toggle('locked',la);
    dh.readOnly=ld;dm.readOnly=ld;
    document.querySelectorAll('.step').forEach(function(b){b.disabled=ld;});
    document.querySelectorAll('#nudge button').forEach(function(b){b.disabled=la;});
    $('#nm1').textContent='− '+minStep()+' min';
    $('#nm2').textContent='+ '+minStep()+' min';
    var done=st.solved||st.revealed;
    $('#bCheck').disabled=done;
    $('#bHint').disabled=done;
    $('#bReveal').disabled=done;
    $('#bNext').className=done?'primary':'';
    drawAna();
  }

  function newTask(){
    var prev=hh(st.target),t;
    st.type=st.pref==='mix'?(Math.random()<0.5?'a2d':'d2a'):st.pref;
    do{t=randomTime();}while(hh(t)===prev&&st.level>1);
    st.target=t;st.solved=false;st.revealed=false;st.attempts=0;
    if(st.type==='a2d'){
      st.ana={h12:t.h%12,m:t.m};
      dh.value='';dm.value='';
    }else{
      dh.value=pad(t.h);dm.value=pad(t.m);
      st.ana={h12:0,m:0};
    }
    setFb('info','Nova naloga. Ko si pripravljen, pritisni <strong>Preveri</strong>.');
    render();
  }

  /* ---------- vlečenje kazalcev ---------- */
  var drag=null;
  function angleOf(e){
    var r=svg.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    var d=Math.atan2(dx,-dy)*180/Math.PI;
    return d<0?d+360:d;
  }
  function start(e,which){
    if(lockedAna())return;
    drag=which;
    try{svg.setPointerCapture(e.pointerId);}catch(x){}
    e.preventDefault();
  }
  hH.addEventListener('pointerdown',function(e){start(e,'h');});
  hM.addEventListener('pointerdown',function(e){start(e,'m');});
  svg.addEventListener('pointermove',function(e){
    if(!drag||lockedAna())return;
    var a=st.ana,deg=angleOf(e);
    if(drag==='m'){
      var s=minStep(),nm=Math.round(Math.round(deg/6)/s)*s%60,pm=a.m;
      if(nm!==pm){
        if(pm>=45&&nm<=15)a.h12=(a.h12+1)%12;
        else if(pm<=15&&nm>=45)a.h12=(a.h12+11)%12;
        a.m=nm;
      }
    }else{
      a.h12=(((Math.round(deg/30-a.m/60))%12)+12)%12;
    }
    drawAna();
  });
  function stop(){drag=null;}
  svg.addEventListener('pointerup',stop);
  svg.addEventListener('pointercancel',stop);

  document.querySelectorAll('#nudge button').forEach(function(b){
    b.addEventListener('click',function(){
      if(lockedAna())return;
      var a=st.ana,n=b.getAttribute('data-n'),s=minStep();
      if(n==='h+')a.h12=(a.h12+1)%12;
      else if(n==='h-')a.h12=(a.h12+11)%12;
      else{
        var old=a.m,nm=n==='m+'?(old+s)%60:(old-s+60)%60;
        if(n==='m+'&&nm<old)a.h12=(a.h12+1)%12;
        if(n==='m-'&&nm>old)a.h12=(a.h12+11)%12;
        a.m=nm;
      }
      drawAna();
    });
  });

  /* ---------- digitalna ura ---------- */
  function clampInput(inp,max){
    inp.value=inp.value.replace(/\D/g,'').slice(0,2);
  }
  dh.addEventListener('input',function(){clampInput(dh,23);});
  dm.addEventListener('input',function(){clampInput(dm,59);});
  dh.addEventListener('change',function(){if(dh.value!=='')dh.value=pad(Math.min(23,+dh.value));});
  dm.addEventListener('change',function(){if(dm.value!=='')dm.value=pad(Math.min(59,+dm.value));});
  document.querySelectorAll('.step').forEach(function(b){
    b.addEventListener('click',function(){
      if(lockedDig())return;
      var isH=b.getAttribute('data-t')==='h',inp=isH?dh:dm,max=isH?24:60,s=isH?1:minStep();
      var d=+b.getAttribute('data-d'),v;
      if(inp.value==='')v=d>0?0:max-s;
      else v=((+inp.value+d*s)%max+max)%max;
      inp.value=pad(v);
    });
  });
  function readDig(){
    if(dh.value===''||dm.value==='')return null;
    return {h:Math.min(23,+dh.value),m:Math.min(59,+dm.value)};
  }

  /* ---------- preverjanje ---------- */
  function good(){
    st.solved=true;st.score.solved++;
    if(st.attempts===1)st.score.first++;
    var t=st.target;
    setFb('ok','<strong>Pravilno!</strong> '+hh(t)+' na digitalni uri je enako kot na analogni.<span class="say">'+say(t.h,t.m)+'</span>');
    render();
  }
  function check(){
    if(st.solved||st.revealed)return;
    var t=st.target,msgs=[],okH,okM;
    if(st.type==='a2d'){
      var r=readDig();
      if(!r){setFb('bad','Vpiši ure in minute, potem pritisni Preveri.');return;}
      st.attempts++;
      okH=r.h===t.h;okM=r.m===t.m;
      if(okH&&okM)return good();
      if(okH)msgs.push('Ure so pravilne.');
      else if(r.h%12===t.h%12)msgs.push('Številka ure je prava, v 24-urnem zapisu pa ne. Čas dneva je '+part(t.h,t.m)+', zato preveri, ali moraš prišteti 12.');
      else msgs.push('Ure niso pravilne. Poglej kratki kazalec.');
      if(okM)msgs.push('Minute so pravilne.');
      else msgs.push('Minute niso pravilne. Poglej dolgi kazalec: številko pomnoži s 5.');
    }else{
      st.attempts++;
      okH=st.ana.h12===t.h%12;okM=st.ana.m===t.m;
      if(okH&&okM)return good();
      if(okH)msgs.push('Kratki kazalec je pravilen.');
      else msgs.push('Kratki kazalec ni pravi. Če je ura večja od 12, odštej 12.');
      if(okM)msgs.push('Dolgi kazalec je pravilen.');
      else msgs.push('Dolgi kazalec ni pravi. Minute deli s 5, da dobiš številko na številčnici.');
    }
    setFb('bad','<strong>Še ni prav.</strong> '+msgs.join(' '));
  }

  function hint(){
    var t=st.target,h12=t.h%12,base=Math.floor(t.m/5),extra=t.m%5,out=[];
    if(st.type==='a2d'){
      out.push('<strong>Ure:</strong> kratki kazalec '+(t.m===0?'kaže na številko ':'je že prešel številko ')+(h12===0?12:h12)+'.'+(t.h>=12?' Čas dneva je '+part(t.h,t.m)+', zato prištej 12.':''));
      if(extra===0)out.push('<strong>Minute:</strong> dolgi kazalec kaže na '+(base===0?12:base)+', to je '+(base===0?'0 minut':base+' × 5 = '+base*5+' minut')+'.');
      else out.push('<strong>Minute:</strong> dolgi kazalec je na številki '+(base===0?12:base)+' ('+base*5+' minut) in še '+extra+(extra===1?' črtico':extra===2?' črtici':' črtice')+' naprej.');
    }else{
      out.push('<strong>Ure:</strong> '+(t.h>12?t.h+' − 12 = '+(t.h-12)+'. Kratki kazalec kaže proti številki '+(t.h-12)+'.':'kratki kazalec kaže proti številki '+(h12===0?12:h12)+'.')+(t.m>0?' Pri '+t.m+' minutah je malo naprej od te številke.':''));
      if(extra===0)out.push('<strong>Minute:</strong> '+t.m+' ÷ 5 = '+(t.m/5)+'. Dolgi kazalec kaže na '+(base===0?12:base)+'.');
      else out.push('<strong>Minute:</strong> '+base*5+' minut je številka '+(base===0?12:base)+', nato še '+extra+(extra===1?' črtica':extra===2?' črtici':' črtice')+'.');
    }
    setFb('hint','<strong>Namig</strong><br>'+out.join('<br>'));
  }

  function reveal(){
    if(st.solved||st.revealed)return;
    var t=st.target;
    if(st.type==='a2d'){dh.value=pad(t.h);dm.value=pad(t.m);}
    else st.ana={h12:t.h%12,m:t.m};
    st.revealed=true;
    setFb('info','<strong>Rešitev: '+hh(t)+'.</strong><span class="say">'+say(t.h,t.m)+'</span>Poskusi z novo nalogo.');
    render();
  }

  /* ---------- gumbi in nastavitve ---------- */
  $('#bCheck').addEventListener('click',check);
  $('#bHint').addEventListener('click',hint);
  $('#bReveal').addEventListener('click',reveal);
  $('#bNext').addEventListener('click',newTask);
  document.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click',function(){
      st.pref=b.getAttribute('data-mode');
      document.querySelectorAll('[data-mode]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
      newTask();
    });
  });
  $('#level').addEventListener('change',function(e){st.level=+e.target.value;newTask();});
  $('#help').addEventListener('change',function(e){svg.classList.toggle('nohelp',!e.target.checked);});

  newTask();
})();
</script>
</body>
</html>
